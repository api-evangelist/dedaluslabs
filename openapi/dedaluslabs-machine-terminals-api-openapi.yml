components:
  schemas:
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    CreateTerminalRequest:
      additionalProperties: false
      properties:
        cwd:
          type: string
        env:
          additionalProperties:
            type: string
          type: object
        height:
          format: int64
          type: integer
        shell:
          type: string
        width:
          format: int64
          type: integer
      required:
      - width
      - height
      type: object
    TerminalResponse:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        error_code:
          type: string
        error_message:
          type: string
        expires_at:
          format: date-time
          type: string
        height:
          format: int64
          type: integer
        machine_id:
          type: string
        protocol:
          enum:
          - websocket
          type: string
        ready_at:
