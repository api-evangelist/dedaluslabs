  /v1/machines/{machine_id}/terminals/{terminal_id}/stream:
    get:
      description: Upgrades to a WebSocket connection for interactive terminal I/O. Clients send JSON `TerminalClientEvent` messages and receive JSON `TerminalServerEvent` messages. Terminal byte streams are base64-encoded inside `input` and `output` events; `resize` events use integer `width` and `height` fields.
      operationId: connectMachineTerminal
      parameters:
      - description: Organization ID header applied to all DCS requests.
        in: header
        name: X-Dedalus-Org-Id
        schema:
          format: uuid
          type: string
      - description: Machine identifier.
        in: path
        name: machine_id
        required: true
        schema:
          type: string
      - description: Terminal identifier.
        in: path
        name: terminal_id
        required: true
        schema:
          type: string
      responses:
        '101':
          description: Switching Protocols to WebSocket
        '401':
          content:
            application/json:
              examples:
                invalid_key:
                  value:
                    error_code: AUTH_INVALID
                    message: invalid Dedalus API key
                    retryable: false
                missing_key:
                  value:
                    error_code: AUTH_REQUIRED
                    message: missing Dedalus API key
                    retryable: false
              schema:
                additionalProperties: false
                properties:
                  details:
                    additionalProperties:
                      type: string
                    type: object
                  error_code:
                    type: string
                  message:
                    type: string
                  retry_after_ms:
                    format: int64
                    type: integer
                  retryable:
                    type: boolean
                required:
                - error_code
                - message
                - retryable
                type: object
          description: Authentication required
        '403':
          content:
            application/json:
              examples:
                org_mismatch:
                  value:
                    error_code: AUTH_ORG_MISMATCH
                    message: org scope does not match API key ownership
                    retryable: false
                scope_forbidden:
                  value:
                    error_code: AUTH_SCOPE_FORBIDDEN
                    message: internal service authorization is required
                    retryable: false
              schema:
                additionalProperties: false
                properties:
                  details:
                    additionalProperties:
                      type: string
                    type: object
                  error_code:
                    type: string
                  message:
                    type: string
                  retry_after_ms:
                    format: int64
                    type: integer
                  retryable:
                    type: boolean
                required:
                - error_code
                - message
                - retryable
                type: object
          description: Forbidden
        '409':
          content:
            application/json:
              examples:
                terminal_closed:
                  value:
                    error_code: INVALID_STATE
                    message: terminal is not ready for streaming
                    retryable: false
                    details:
                      current_status: closed
                      expected_status: ready
                terminal_not_ready:
                  value:
                    error_code: INVALID_STATE
                    message: terminal is not ready for streaming
                    retryable: true
                    retry_after_ms: 1000
