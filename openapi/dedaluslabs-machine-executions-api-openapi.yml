      - in: header
        name: X-Dedalus-Org-Id
        schema:
          type: string
      - in: path
        name: machine_id
        required: true
        schema:
          type: string
      - explode: false
        in: query
        name: limit
        schema:
          format: int64
          type: integer
      - explode: false
        in: query
        name: cursor
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionListResponse'
          description: OK
        '401':
          content:
            application/json:
              examples:
                invalid_key:
                  value:
                    error_code: AUTH_INVALID
                    message: invalid Dedalus API key
                    retryable: false
                missing_key:
                  value:
                    error_code: AUTH_REQUIRED
                    message: missing Dedalus API key
                    retryable: false
              schema:
                additionalProperties: false
                properties:
                  details:
                    additionalProperties:
                      type: string
                    type: object
                  error_code:
                    type: string
                  message:
                    type: string
                  retry_after_ms:
                    format: int64
                    type: integer
                  retryable:
                    type: boolean
                required:
                - error_code
                - message
                - retryable
                type: object
          description: Authentication required
        '403':
          content:
            application/json:
