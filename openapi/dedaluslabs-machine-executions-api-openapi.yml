            $ref: '#/components/schemas/ExecutionResponse'
          type:
          - array
          - 'null'
        next_cursor:
          type: string
      required:
      - items
      type: object
    ExecutionResponse:
      additionalProperties: false
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/ArtifactRef'
          type:
          - array
          - 'null'
        command:
          items:
            type: string
          type:
          - array
          - 'null'
        completed_at:
          format: date-time
          type: string
        created_at:
          format: date-time
          type: string
        cwd:
          type: string
        env_keys:
          items:
            type: string
          type:
          - array
          - 'null'
        error_code:
          type: string
        error_message:
          type: string
        execution_id:
          type: string
        exit_code:
          format: int64
          type: integer
        expires_at:
          format: date-time
          type: string
        machine_id:
          type: string
        retry_after_ms:
          format: int64
          type: integer
        signal:
          format: int64
          type: integer
        started_at:
          format: date-time
          type: string
        status:
          enum:
          - wake_in_progress
          - queued
          - running
          - succeeded
          - failed
          - cancelled
          - expired
          type: string
        stderr_bytes:
          format: int64
          type: integer
        stderr_truncated:
          type: boolean
        stdout_bytes:
          format: int64
          type: integer
        stdout_truncated:
          type: boolean
      required:
