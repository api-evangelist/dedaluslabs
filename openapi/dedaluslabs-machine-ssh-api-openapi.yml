components:
  schemas:
    SSHConnection:
      additionalProperties: false
      properties:
        endpoint:
          type: string
        host_trust:
          $ref: '#/components/schemas/SSHHostTrust'
        port:
          format: int64
          type: integer
        ssh_username:
          type: string
        user_certificate:
          type: string
      required:
      - endpoint
      - port
      - ssh_username
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
          - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type:
          - array
          - 'null'
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
          - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
          - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
          - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
          - https://example.com/errors/example
          format: uri
          type: string
      type: object
    SSHSessionListResponse:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/SSHSessionResponse'
          type:
          - array
          - 'null'
        next_cursor:
          type: string
      required:
      - items
      type: object
    SSHSessionResponse:
      additionalProperties: false
      properties:
        connection:
          $ref: '#/components/schemas/SSHConnection'
        created_at:
          format: date-time
          type: string
        error_code:
          type: string
        error_message:
          type: string
        expires_at:
          format: date-time
          type: string
        machine_id:
          type: string
        ready_at:
          format: date-time
          type: string
        retry_after_ms:
          format: int64
          type: integer
        session_id:
          type: string
        status:
          enum:
          - wake_in_progress
          - ready
          - closed
          - expired
          - failed
          type: string
      required:
      - session_id
      - machine_id
      - status
      - created_at
      type: object
    SSHHostTrust:
      additionalProperties: false
      properties:
        host_pattern:
          type: string
        kind:
          enum:
          - cert_authority
          type: string
        public_key:
          type: string
      required:
      - kind
      - host_pattern
      - public_key
      type: object
    CreateSSHSessionRequest:
      additionalProperties: false
      properties:
        public_key:
          type: string
      required:
      - public_key
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
