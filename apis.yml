aid: dedaluslabs
name: Dedalus Labs
description: 'Dedalus Labs builds infrastructure for AI agents. It runs two production APIs: the Dedalus
  Agents API, an OpenAI-compatible MCP gateway that lets you mix and match any model from any provider
  with tools drawn from the Dedalus MCP marketplace (chat completions, embeddings, audio, images, and
  OCR through one endpoint); and Dedalus Cloud Services (Dedalus Machines), persistent Linux VMs for agents
  that start in under a second, preserve their filesystem and memory across sleep/wake, and bill per second
  with no idle tax. Both APIs authenticate with a Dedalus API key (Bearer or x-api-key), support idempotent
  mutations, and ship official SDKs in TypeScript, Python, and Go plus a CLI and Terraform provider. Dedalus
  is a portfolio company of Kindred Ventures.'
