overlay: 1.0.0
info:
  title: API Evangelist enhancements for Dedalus Agents API
  version: 1.0.0
extends: openapi/dedaluslabs-agents-openapi-original.json
actions:
- target: $.info
  update:
    x-apievangelist-network: https://apis.io/provider/dedaluslabs
    x-apievangelist-category: [ai, llm, mcp, gateway, inference]
    x-apievangelist-auth: [bearer, api-key]
